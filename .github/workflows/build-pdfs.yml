name: Build diary PDFs

on:
  push:
    paths:
      - "entries/**"
      - "scripts/diary.py"
      - "assets/photo.jpg"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install fonts and PDF engine
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 fonts-dejavu-core fonts-noto-core
          sudo apt-get install -y fonts-hosny-amiri || true
          pip install -r requirements.txt

      - name: Build PDFs for new or changed entries
        run: |
          CHANGED=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" -- entries 2>/dev/null | grep '\.md$' || true)
          if [ -n "$CHANGED" ]; then python scripts/diary.py build $CHANGED; fi
          python scripts/diary.py build

      - name: Commit PDFs
        run: |
          git config user.name "life-diary-bot"
          git config user.email "life-diary-bot@users.noreply.github.com"
          git add pdf ACHIEVEMENTS.md
          git diff --cached --quiet || (git commit -m "Build diary PDFs [skip ci]" && git push)

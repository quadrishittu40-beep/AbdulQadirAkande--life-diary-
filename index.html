<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Life Diary">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{--bg:#f7f3ec;--card:#fffdf8;--ink:#2b2a27;--mute:#7a756b;--line:#e4ddcf;--accent:#1f6f5c;--accent-ink:#fff;--danger:#b3412f}
@media (prefers-color-scheme:dark){:root{--bg:#171917;--card:#1f221f;--ink:#ece8de;--mute:#9a9588;--line:#31352f;--accent:#4fb89c;--accent-ink:#0d1512;--danger:#e07a68}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Naskh Arabic",sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
header.top{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) calc(14px + env(safe-area-inset-right,0px)) 10px calc(14px + env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);background:var(--card);position:sticky;top:0;z-index:5}
header.top h1{font-size:18px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{border:1px solid var(--line);background:var(--card);padding:8px 12px;border-radius:10px;cursor:pointer;min-height:40px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--danger)}
.btn:active{transform:translateY(1px)}
.app{display:grid;grid-template-columns:320px 1fr;height:calc(100% - 61px - env(safe-area-inset-top,0px))}
aside{border-right:1px solid var(--line);overflow:auto;padding:12px}
main{overflow:auto;padding:16px}
.search{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);margin-bottom:10px}
.item{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.item.active{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.item .d{font-weight:600}
.item .s{color:var(--mute);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .b{font-size:12px;color:var(--accent)}
.panel{max-width:760px;margin:0 auto}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.row>*{flex:1;min-width:140px}
label{display:block;font-size:13px;color:var(--mute);margin:12px 0 4px;font-weight:600;letter-spacing:.02em}
input[type=date],select,input[type=text]{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
textarea{width:100%;min-height:110px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--card);resize:vertical}
.hint{font-size:12px;color:var(--mute);margin-top:4px}
.status{font-size:13px;color:var(--mute);min-height:20px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}
.back{display:none}
.empty{color:var(--mute);text-align:center;padding:40px 10px}
.ach-day{margin-bottom:18px}
.ach-day h3{margin:0 0 6px;font-size:15px;color:var(--accent)}
.ach-day li{margin:3px 0}
.profile{display:flex;gap:14px;align-items:center}
.avatar{width:72px;height:72px;border-radius:50%;background:var(--line);object-fit:cover;flex:none}
#sheet{display:none}
#login{display:none;position:fixed;inset:0;z-index:50;align-items:center;justify-content:center;padding:16px;background:var(--bg)}
body.locked #login{display:flex}
body.locked header.top,body.locked .app{display:none!important}
#login form{width:100%;max-width:360px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px}
#login h2{margin:0 0 4px;font-size:22px}
#login p{margin:0 0 8px;color:var(--mute);font-size:14px}
#login .err{color:var(--danger);font-size:14px;min-height:20px;margin-top:8px}
#login .chk{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:14px;color:var(--mute)}
#login .chk input{width:auto}
#login input[type=email],#login input[type=password]{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
#login .btn{width:100%;margin-top:14px}
body.hasbg{background-image:var(--bgimg);background-size:cover;background-position:center;background-attachment:fixed}
body.hasbg header.top{background:color-mix(in srgb,var(--card) 88%,transparent)}
body.hasbg aside,body.hasbg main{background:color-mix(in srgb,var(--bg) 80%,transparent)}
.thumbs{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0}
.thumb{position:relative}
.thumb img{width:96px;height:96px;object-fit:cover;border-radius:10px;border:1px solid var(--line);display:block}
.thumb button{position:absolute;top:-8px;right:-8px;width:26px;height:26px;border-radius:50%;border:1px solid var(--line);background:var(--card);cursor:pointer;line-height:1;padding:0}
.bgprev{width:100%;max-width:320px;height:120px;object-fit:cover;border-radius:12px;border:1px solid var(--line);display:block;margin:8px 0}
@media (max-width:760px){
 .app{grid-template-columns:1fr}
 aside{display:block}
 main{display:none}
 body.edit aside{display:none}
 body.edit main{display:block}
 .back{display:inline-block}
}
@media print{
 @page{size:A4;margin:0}
 *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
 header.top,.app{display:none!important}
 html,body{height:auto;background:#fff;color:#000}
 #sheet{display:block}
}
#sheet{font-family:Georgia,"Noto Naskh Arabic",serif;color:#000;padding:0}
#sheet .pg{page-break-after:always;min-height:296mm;padding:14mm;background-color:#fff;background-repeat:repeat-y;background-size:100% 296mm;background-position:top left}
#sheet .pg:last-child{page-break-after:auto}
#sheet .hd{display:flex;align-items:center;gap:14px;border-bottom:2px solid #1f6f5c;padding-bottom:10px;margin-bottom:14px}
#sheet .hd img{width:64px;height:64px;border-radius:50%;object-fit:cover}
#sheet .hd .n{font-size:20px;font-weight:700}
#sheet .hd .t{color:#555;font-size:13px}
#sheet h2{font-size:14px;text-transform:uppercase;letter-spacing:.08em;color:#1f6f5c;margin:16px 0 4px}
#sheet p,#sheet li{font-size:14px;margin:2px 0;white-space:pre-wrap}
#sheet ul{margin:0;padding-left:20px}
#sheet .ph{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
#sheet .ph img{width:48%;max-height:75mm;object-fit:cover;border-radius:4px}
#sheet .sig{margin-top:30px;text-align:right}
#sheet .sig .ar{font-size:30px;line-height:1.2}
#sheet .sig .nm{font-size:12px;color:#555;border-top:1px solid #999;display:inline-block;padding-top:3px;margin-top:2px}
</style>
</head>
<body class="locked">
<div id="login">
  <form id="loginForm" autocomplete="on">
    <h2>My Life Diary</h2>
    <p>Sign in to open your diary.</p>
    <label for="lEmail">EMAIL</label>
    <input id="lEmail" name="email" type="email" autocomplete="username" required>
    <label for="lPass">PASSWORD</label>
    <input id="lPass" name="password" type="password" autocomplete="current-password" required>
    <label class="chk"><input id="lStay" type="checkbox" checked> Keep me signed in on this device</label>
    <button class="btn primary" type="submit">Sign in</button>
    <div class="err" id="lErr" role="alert"></div>
  </form>
</div>
<header class="top">
  <button class="btn back" id="backBtn" aria-label="Back to list">←</button>
  <h1 id="title">My Life Diary</h1>
  <button class="btn primary" id="todayBtn">Today</button>
  <button class="btn" id="achBtn">Achievements</button>
  <button class="btn" id="installBtn" hidden>Install</button>
  <button class="btn" id="setBtn">⚙</button>
  <button class="btn" id="outBtn" title="Sign out">Sign out</button>
</header>

<div class="app">
  <aside>
    <input class="search" id="search" type="text" placeholder="Search entries…" dir="auto">
    <div id="list"></div>
  </aside>
  <main><div class="panel" id="panel"></div></main>
</div>

<div id="sheet"></div>

<script>
(function(){
'use strict';
var KEY='lifeDiary.v1';
var mem=null;
var state={profile:{name:'Shittu AbdulQadir Adeshina',photo:''},entries:{}};
var FIELDS=[
 ['activities','Daily activities','What did you do today?'],
 ['achievements','Achievements','One per line'],
 ['reflections','Reflections','Thoughts, lessons, feelings…'],
 ['gratitude','Grateful for',''],
 ['plans','Plans for tomorrow','']
];
var MOODS=['','😄 Great','🙂 Good','😐 Okay','😔 Low','😣 Hard'];
var cur=todayStr();
var view='entry';
/* Faded photos used behind each PDF page. One is picked per page, the same one every time for a given day. */
var PAGE_BGS=['assets/backgrounds/bg1.jpg','assets/backgrounds/bg2.jpg','assets/backgrounds/bg3.jpg','assets/backgrounds/bg4.jpg'];

function load(){
 try{var r=localStorage.getItem(KEY);if(r){var d=JSON.parse(r);if(d&&d.entries){state=d;state.profile=state.profile||{name:'',photo:''};}}}catch(e){if(mem)state=mem;}
}
function save(){
 mem=state;
 try{localStorage.setItem(KEY,JSON.stringify(state));setStatus('Saved');}
 catch(e){setStatus('Could not save in this browser. Use Backup to keep your data.');}
}
function setStatus(t){var s=document.getElementById('status');if(s)s.textContent=t;}
function pad(n){return n<10?'0'+n:''+n}
function todayStr(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function parse(k){var p=k.split('-');return new Date(+p[0],+p[1]-1,+p[2]);}
function fmt(k,long){return parse(k).toLocaleDateString(undefined,long?{weekday:'long',year:'numeric',month:'long',day:'numeric'}:{weekday:'short',year:'numeric',month:'short',day:'numeric'});}
function el(tag,attrs,kids){
 var e=document.createElement(tag);
 if(attrs)for(var k in attrs){if(k==='text')e.textContent=attrs[k];else if(k==='on')for(var ev in attrs.on)e.addEventListener(ev,attrs.on[ev]);else e.setAttribute(k,attrs[k]);}
 (kids||[]).forEach(function(c){if(c)e.appendChild(c);});
 return e;
}
function lines(t){return (t||'').split('\n').map(function(s){return s.replace(/^\s*[-•*]\s*/,'').trim();}).filter(Boolean);}
function hasContent(e){return e&&(FIELDS.some(function(f){return (e[f[0]]||'').trim();})||e.mood||(e.photos&&e.photos.length));}
function resizeImage(file,max,q,cb){
 var r=new FileReader();
 r.onload=function(){var im=new Image();im.onload=function(){
  var sc=Math.min(1,max/Math.max(im.width,im.height));
  var c=document.createElement('canvas');c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);
  c.getContext('2d').drawImage(im,0,0,c.width,c.height);
  cb(c.toDataURL('image/jpeg',q));
 };im.onerror=function(){setStatus('Could not read that image.');};im.src=r.result;};
 r.readAsDataURL(file);
}
function applyBg(){
 var b=state.profile&&state.profile.bg;
 if(b){document.body.style.setProperty('--bgimg','url("'+b+'")');document.body.classList.add('hasbg');}
 else{document.body.style.removeProperty('--bgimg');document.body.classList.remove('hasbg');}
}
function bgFor(key){
 var h=0;for(var i=0;i<key.length;i++)h=(h*31+key.charCodeAt(i))>>>0;
 return PAGE_BGS[h%PAGE_BGS.length];
}
function printWhenReady(urls){
 var left=urls.length,done=false;
 function go(){if(done)return;done=true;window.print();}
 if(!left){go();return;}
 urls.forEach(function(u){
  var im=new Image();
  im.onload=im.onerror=function(){left--;if(left<=0)go();};
  im.src=u;
 });
 setTimeout(go,3000);
}

function renderList(){
 var q=document.getElementById('search').value.trim().toLowerCase();
 var box=document.getElementById('list');box.innerHTML='';
 var keys=Object.keys(state.entries).sort().reverse().filter(function(k){
  if(!q)return true;var e=state.entries[k];
  return (k+' '+FIELDS.map(function(f){return e[f[0]]||''}).join(' ')).toLowerCase().indexOf(q)>-1;
 });
 if(!keys.length){box.appendChild(el('div',{class:'empty',text:q?'No matches.':'No entries yet. Tap Today to write your first one.'}));return;}
 keys.forEach(function(k){
  var e=state.entries[k];
  var snip=(e.activities||e.reflections||e.achievements||'').replace(/\s+/g,' ').trim();
  var n=lines(e.achievements).length;
  var kids=[el('div',{class:'d',text:fmt(k)}),el('div',{class:'s',dir:'auto',text:snip||'(empty)'})];
  var meta=[];
  if(n)meta.push('★ '+n+' achievement'+(n>1?'s':''));
  if(e.photos&&e.photos.length)meta.push('📷 '+e.photos.length);
  if(meta.length)kids.push(el('div',{class:'b',text:meta.join('  ·  ')}));
  box.appendChild(el('button',{class:'item'+(view==='entry'&&k===cur?' active':''),on:{click:function(){openEntry(k);}}},kids));
 });
}

function openEntry(k){cur=k;view='entry';document.body.classList.add('edit');render();}

function renderEntry(){
 var p=document.getElementById('panel');p.innerHTML='';
 var e=state.entries[cur]||{};
 document.getElementById('title').textContent=fmt(cur);
 var dateIn=el('input',{type:'date',value:cur,on:{change:function(){if(this.value)openEntry(this.value);}}});
 var mood=el('select',{on:{change:function(){upd('mood',this.value);}}},MOODS.map(function(m){var o=el('option',{value:m,text:m||'Mood (optional)'});if(m===(e.mood||''))o.selected=true;return o;}));
 p.appendChild(el('div',{class:'row'},[el('div',{},[el('label',{text:'DATE'}),dateIn]),el('div',{},[el('label',{text:'MOOD'}),mood])]));
 FIELDS.forEach(function(f){
  var ta=el('textarea',{dir:'auto',placeholder:f[2],'aria-label':f[1]});
  ta.value=e[f[0]]||'';
  ta.addEventListener('input',function(){upd(f[0],ta.value);});
  p.appendChild(el('label',{text:f[1].toUpperCase()}));
  p.appendChild(ta);
 });
 p.appendChild(el('label',{text:'PHOTOS'}));
 var thumbs=el('div',{class:'thumbs'});
 (e.photos||[]).forEach(function(src,i){
  thumbs.appendChild(el('div',{class:'thumb'},[el('img',{src:src,alt:'Photo '+(i+1)}),
   el('button',{'aria-label':'Remove photo',text:'×',on:{click:function(){removePhoto(i);}}})]));
 });
 p.appendChild(thumbs);
 var pin=el('input',{type:'file',accept:'image/*',multiple:'multiple',style:'display:none'});
 pin.addEventListener('change',function(){addPhotos(pin.files);pin.value='';});
 p.appendChild(el('button',{class:'btn',text:'＋ Add photos',on:{click:function(){pin.click();}}}));
 p.appendChild(pin);
 p.appendChild(el('div',{class:'hint',text:'Photos are shrunk to save space. Arabic and other right-to-left text is supported.'}));
 p.appendChild(el('div',{class:'actions'},[
  el('button',{class:'btn primary',text:'Save as PDF',on:{click:function(){printKeys([cur]);}}}),
  el('button',{class:'btn danger',text:'Delete entry',on:{click:delEntry}})
 ]));
 p.appendChild(el('div',{class:'status',id:'status',text:state.entries[cur]?'Saved':'Not saved yet. Start typing.'}));
}

function upd(f,v){
 var e=state.entries[cur]||(state.entries[cur]={});
 e[f]=v;e.updated=Date.now();
 if(!hasContent(e)){delete state.entries[cur];}
 save();renderList();
}
function addPhotos(files){
 var list=Array.prototype.slice.call(files||[]);if(!list.length)return;
 var pending=list.length;
 list.forEach(function(f){
  resizeImage(f,1000,.8,function(d){
   var e=state.entries[cur]||(state.entries[cur]={});
   (e.photos=e.photos||[]).push(d);e.updated=Date.now();
   pending--;
   if(!pending){save();renderEntry();renderList();}
  });
 });
}
function removePhoto(i){
 var e=state.entries[cur];if(!e||!e.photos)return;
 e.photos.splice(i,1);if(!e.photos.length)delete e.photos;
 if(!hasContent(e))delete state.entries[cur];
 save();renderEntry();renderList();
}
function delEntry(){
 if(!state.entries[cur]){return;}
 if(!confirm('Delete the entry for '+fmt(cur)+'?'))return;
 delete state.entries[cur];save();renderEntry();renderList();
}

function renderAch(){
 var p=document.getElementById('panel');p.innerHTML='';
 document.getElementById('title').textContent='Achievements';
 var keys=Object.keys(state.entries).sort().reverse().filter(function(k){return lines(state.entries[k].achievements).length;});
 var total=0;
 keys.forEach(function(k){total+=lines(state.entries[k].achievements).length;});
 p.appendChild(el('div',{class:'row'},[el('div',{},[el('strong',{text:total+' achievement'+(total===1?'':'s')+' across '+keys.length+' day'+(keys.length===1?'':'s')})]),
  el('button',{class:'btn',text:'Save as PDF',on:{click:function(){printAch(keys);}}})]));
 if(!keys.length)p.appendChild(el('div',{class:'empty',text:'Achievements you add to daily entries appear here, newest first.'}));
 keys.forEach(function(k){
  var ul=el('ul',{dir:'auto'},lines(state.entries[k].achievements).map(function(t){return el('li',{text:t});}));
  p.appendChild(el('div',{class:'ach-day'},[el('h3',{text:fmt(k)}),ul]));
 });
}

function renderSettings(){
 var p=document.getElementById('panel');p.innerHTML='';
 document.getElementById('title').textContent='Settings & backup';
 var img=el('img',{class:'avatar',alt:'Your photo'});if(state.profile.photo)img.src=state.profile.photo;
 var file=el('input',{type:'file',accept:'image/*'});
 file.addEventListener('change',function(){
  var f=file.files&&file.files[0];if(!f)return;
  var r=new FileReader();
  r.onload=function(){var im=new Image();im.onload=function(){
   var s=256,c=document.createElement('canvas');c.width=c.height=s;
   var m=Math.min(im.width,im.height),sx=(im.width-m)/2,sy=(im.height-m)/2;
   c.getContext('2d').drawImage(im,sx,sy,m,m,0,0,s,s);
   state.profile.photo=c.toDataURL('image/jpeg',.85);save();img.src=state.profile.photo;
  };im.src=r.result;};
  r.readAsDataURL(f);
 });
 var nm=el('input',{type:'text',dir:'auto',value:state.profile.name||''});
 nm.addEventListener('input',function(){state.profile.name=nm.value;save();});
 p.appendChild(el('div',{class:'profile'},[img,el('div',{style:'flex:1'},[el('label',{text:'YOUR NAME (SHOWN ON PDFs)'}),nm])]));
 p.appendChild(el('label',{text:'PHOTO (SHOWN IN PDF HEADER)'}));
 p.appendChild(file);
 p.appendChild(el('label',{text:'BACKGROUND PHOTO (BEHIND THE APP)'}));
 if(state.profile.bg)p.appendChild(el('img',{class:'bgprev',src:state.profile.bg,alt:'Background preview'}));
 var bgIn=el('input',{type:'file',accept:'image/*',style:'display:none'});
 bgIn.addEventListener('change',function(){
  var f=bgIn.files&&bgIn.files[0];if(!f)return;
  resizeImage(f,1600,.75,function(d){state.profile.bg=d;save();applyBg();renderSettings();});
 });
 p.appendChild(el('div',{class:'actions',style:'margin:8px 0'},[
  el('button',{class:'btn',text:state.profile.bg?'Change background':'Choose background',on:{click:function(){bgIn.click();}}}),
  state.profile.bg?el('button',{class:'btn danger',text:'Remove',on:{click:function(){delete state.profile.bg;save();applyBg();renderSettings();}}}):null,
  bgIn
 ]));
 p.appendChild(el('label',{text:'INSTALL AS AN APP'}));
 p.appendChild(el('div',{class:'hint',text:'Android or computer: tap the Install button at the top, or use the browser menu and choose Install app. iPhone: tap Share, then Add to Home Screen. Open the diary from the home screen icon afterwards.'}));
 p.appendChild(el('label',{text:'BACKUP'}));
 p.appendChild(el('div',{class:'hint',text:'Your diary is stored only in this browser. Export a backup regularly, and import it to restore or move to another device.'}));
 var imp=el('input',{type:'file',accept:'application/json,.json',style:'display:none'});
 imp.addEventListener('change',function(){
  var f=imp.files&&imp.files[0];if(!f)return;
  var r=new FileReader();
  r.onload=function(){
   try{
    var d=JSON.parse(r.result);if(!d||typeof d.entries!=='object')throw 0;
    var n=0;for(var k in d.entries){if(/^\d{4}-\d{2}-\d{2}$/.test(k)){state.entries[k]=d.entries[k];n++;}}
    if(d.profile){if(d.profile.name)state.profile.name=d.profile.name;if(d.profile.photo)state.profile.photo=d.profile.photo;if(d.profile.bg)state.profile.bg=d.profile.bg;}
    save();applyBg();renderList();alert('Imported '+n+' entries.');
   }catch(x){alert('That file is not a valid diary backup.');}
  };r.readAsText(f);
 });
 p.appendChild(el('div',{class:'actions'},[
  el('button',{class:'btn primary',text:'Export backup',on:{click:exportJSON}}),
  el('button',{class:'btn',text:'Import backup',on:{click:function(){imp.click();}}}),
  el('button',{class:'btn',text:'Save ALL entries as PDF',on:{click:function(){printKeys(Object.keys(state.entries).sort());}}}),
  imp
 ]));
}

function exportJSON(){
 var blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
 var a=document.createElement('a');a.href=URL.createObjectURL(blob);
 a.download='life-diary-backup-'+todayStr()+'.json';
 document.body.appendChild(a);a.click();
 setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},500);
}

function sheetHeader(sub){
 var hd=el('div',{class:'hd'});
 if(state.profile.photo)hd.appendChild(el('img',{src:state.profile.photo,alt:''}));
 hd.appendChild(el('div',{},[el('div',{class:'n',text:state.profile.name||'My Life Diary'}),el('div',{class:'t',text:sub})]));
 return hd;
}
function signature(){
 return el('div',{class:'sig'},[el('div',{class:'ar',dir:'rtl',text:'عبدالقادر'}),el('div',{class:'nm',text:state.profile.name||''})]);
}
function printKeys(keys){
 var s=document.getElementById('sheet');s.innerHTML='';
 var used=[];
 keys.forEach(function(k){
  var e=state.entries[k];if(!e)return;
  var pg=el('div',{class:'pg'});
  var bg=bgFor(k);if(used.indexOf(bg)<0)used.push(bg);
  pg.style.backgroundImage='url("'+bg+'")';
  pg.appendChild(sheetHeader('Daily diary · '+fmt(k,true)+(e.mood?' · '+e.mood:'')));
  FIELDS.forEach(function(f){
   var v=(e[f[0]]||'').trim();if(!v)return;
   pg.appendChild(el('h2',{text:f[1]}));
   if(f[0]==='achievements'){pg.appendChild(el('ul',{dir:'auto'},lines(v).map(function(t){return el('li',{text:t});})));}
   else pg.appendChild(el('p',{dir:'auto',text:v}));
  });
  if(e.photos&&e.photos.length){
   pg.appendChild(el('h2',{text:'Photos'}));
   pg.appendChild(el('div',{class:'ph'},e.photos.map(function(src){return el('img',{src:src,alt:''});})));
  }
  pg.appendChild(signature());
  s.appendChild(pg);
 });
 if(!s.firstChild){alert('Nothing to export yet. Write an entry first.');return;}
 printWhenReady(used);
}
function printAch(keys){
 var s=document.getElementById('sheet');s.innerHTML='';
 var pg=el('div',{class:'pg'});
 var bg=bgFor('achievements-'+todayStr());
 pg.style.backgroundImage='url("'+bg+'")';
 pg.appendChild(sheetHeader('Achievements'));
 keys.forEach(function(k){
  pg.appendChild(el('h2',{text:fmt(k,true)}));
  pg.appendChild(el('ul',{dir:'auto'},lines(state.entries[k].achievements).map(function(t){return el('li',{text:t});})));
 });
 pg.appendChild(signature());
 s.appendChild(pg);
 printWhenReady([bg]);
}

function render(){
 if(view==='entry')renderEntry();else if(view==='ach')renderAch();else renderSettings();
 renderList();
}
function go(v){view=v;document.body.classList.add('edit');render();}

document.getElementById('todayBtn').addEventListener('click',function(){openEntry(todayStr());});
document.getElementById('achBtn').addEventListener('click',function(){go('ach');});
document.getElementById('setBtn').addEventListener('click',function(){go('settings');});
document.getElementById('backBtn').addEventListener('click',function(){document.body.classList.remove('edit');document.getElementById('title').textContent='My Life Diary';});
document.getElementById('search').addEventListener('input',renderList);

/* ---- Sign-in gate (client-side convenience lock; see note in the app guide) ---- */
function sha256(ascii){
 function rr(v,a){return (v>>>a)|(v<<(32-a));}
 var mp=Math.pow,mw=mp(2,32),i,j,res='',words=[],bl=ascii.length*8;
 var hash=sha256.h=sha256.h||[],k=sha256.k=sha256.k||[],pc=k.length,comp={};
 for(var c=2;pc<64;c++){if(!comp[c]){for(i=0;i<313;i+=c)comp[i]=c;hash[pc]=(mp(c,.5)*mw)|0;k[pc++]=(mp(c,1/3)*mw)|0;}}
 ascii+='\x80';while(ascii.length%64-56)ascii+='\x00';
 for(i=0;i<ascii.length;i++){j=ascii.charCodeAt(i);words[i>>2]|=j<<((3-i)%4)*8;}
 words[words.length]=((bl/mw)|0);words[words.length]=bl;
 for(j=0;j<words.length;){
  var w=words.slice(j,j+=16),old=hash;hash=hash.slice(0,8);
  for(i=0;i<64;i++){
   var w15=w[i-15],w2=w[i-2],a=hash[0],e=hash[4];
   var t1=hash[7]+(rr(e,6)^rr(e,11)^rr(e,25))+((e&hash[5])^((~e)&hash[6]))+k[i]+(w[i]=(i<16)?w[i]:(w[i-16]+(rr(w15,7)^rr(w15,18)^(w15>>>3))+w[i-7]+(rr(w2,17)^rr(w2,19)^(w2>>>10)))|0);
   var t2=(rr(a,2)^rr(a,13)^rr(a,22))+((a&hash[1])^(a&hash[2])^(hash[1]&hash[2]));
   hash=[(t1+t2)|0].concat(hash);hash[4]=(hash[4]+t1)|0;
  }
  for(i=0;i<8;i++)hash[i]=(hash[i]+old[i])|0;
 }
 for(i=0;i<8;i++)for(j=3;j+1;j--){var b=(hash[i]>>(j*8))&255;res+=((b<16)?0:'')+b.toString(16);}
 return res;
}
var AUTH_SALT='4785085ef21fef9a';
var AUTH_HASH='f45aecd5688c55b498535a2e2df3376abc313adefa867d476faf9fef4fee24ea';
var TOKEN_KEY='lifeDiary.auth';
function credHash(email,pass){return sha256(AUTH_SALT+unescape(encodeURIComponent(email.trim().toLowerCase()+':'+pass)));}
function unlock(){document.body.classList.remove('locked');}
function lock(){document.body.classList.add('locked');}
function isSignedIn(){
 try{if(localStorage.getItem(TOKEN_KEY)===AUTH_HASH)return true;}catch(e){}
 try{if(sessionStorage.getItem(TOKEN_KEY)===AUTH_HASH)return true;}catch(e){}
 return false;
}
function signOut(){
 try{localStorage.removeItem(TOKEN_KEY);}catch(e){}
 try{sessionStorage.removeItem(TOKEN_KEY);}catch(e){}
 document.getElementById('lPass').value='';lock();
}
document.getElementById('loginForm').addEventListener('submit',function(ev){
 ev.preventDefault();
 var err=document.getElementById('lErr');
 var h=credHash(document.getElementById('lEmail').value,document.getElementById('lPass').value);
 if(h===AUTH_HASH){
  err.textContent='';
  var stay=document.getElementById('lStay').checked;
  try{(stay?localStorage:sessionStorage).setItem(TOKEN_KEY,AUTH_HASH);}catch(e){}
  document.getElementById('lPass').value='';
  unlock();
 }else{
  err.textContent='Incorrect email or password.';
  document.getElementById('lPass').value='';
 }
});
document.getElementById('outBtn').addEventListener('click',signOut);
if(isSignedIn())unlock();

/* ---- Install as an app ---- */
var installEvt=null,installBtn=document.getElementById('installBtn');
window.addEventListener('beforeinstallprompt',function(ev){ev.preventDefault();installEvt=ev;installBtn.hidden=false;});
installBtn.addEventListener('click',function(){
 if(!installEvt)return;
 installEvt.prompt();
 installEvt.userChoice.then(function(){installEvt=null;installBtn.hidden=true;},function(){});
});
window.addEventListener('appinstalled',function(){installEvt=null;installBtn.hidden=true;});
if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0){
 window.addEventListener('load',function(){try{navigator.serviceWorker.register('sw.js').catch(function(){});}catch(e){}});
}

load();
applyBg();
render();
if(window.matchMedia&&window.matchMedia('(min-width:761px)').matches)document.body.classList.add('edit');
})();
</script>
</body>
</html>
